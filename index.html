<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Front Office</title><link rel="stylesheet" href="styles.css"></head><body>
<header><h1>Front Office</h1><span id="snap">No snapshot loaded</span></header>
<main>
<section class="panel"><div class="stats" id="stats"></div>
<div class="row"><button id="load">Load snapshot</button><button id="proj">Get projections</button><label class="check"><input type="checkbox" id="photos" checked> Headshots</label></div>
<p id="msg" role="status"></p></section>
<section id="roster" class="grid"></section>
<section class="panel"><h2>Test a move</h2>
<div class="row"><label>Player<select id="who"></select></label><label>Cost per year ($M)<input id="cost" type="number" value="10" step="0.5" min="0"></label></div>
<p id="score">Get projections to score a move.</p></section>
<details class="panel"><summary>Grading settings</summary><div class="row" id="settings"></div></details>
<details class="panel"><summary>Backup</summary><div class="row"><button id="export">Download backup</button><label>Restore backup<input type="file" id="restore" accept=".json"></label></div></details>
</main>
<script type="module" src="app.js"></script></body></html>
